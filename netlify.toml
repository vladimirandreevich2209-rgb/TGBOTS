[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Forward API requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback routing for client-side React routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
